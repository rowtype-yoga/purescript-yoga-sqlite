name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rowtype-yoga/purescript-yoga-actions/.github/actions/setup@main
      - run: bun install --frozen-lockfile
      - run: spago test
      - run: bash compile-fail-tests/run.sh
